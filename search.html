<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zoeken — Riftblog</title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>


<header>

    <div class="header-inner">

        <div class="logo">
            Rift<span>blog</span>
        </div>

        <nav>

    <a href="{{ '/' | relative_url }}">
        Home
    </a>

    <a href="{{ '/nieuws/' | relative_url }}">
        Nieuws
    </a>

    <a href="{{ '/decks/' | relative_url }}">
        Deckbuilding
    </a>

    <a href="{{ '/strategie/' | relative_url }}">
        Competitie
    </a>

    <a href="{{ '/search/' | relative_url }}">
        🔍
    </a>
<a href="{{ '/search/' | relative_url }}">
    🔍
</a>

<a href="https://www.youtube.com/@riftblog"
   target="_blank"
   rel="noopener"
   aria-label="Riftblog op YouTube"
   class="youtube-link">
    <img src="{{ '/assets/images/posts/YouTubeIcon.png' | relative_url }}"
         alt="YouTube">
</a>
</nav>

    </div>

</header>


<main class="articles">


    <section class="hero">

        <div class="hero-label">
            Riftblog
        </div>

        <h1>
            Zoeken
        </h1>

        <p>
            Zoek in alle artikelen van Riftblog.
        </p>

    </section>


    <div class="search-box">

        <input
            type="search"
            id="search-input"
            placeholder="Zoek bijvoorbeeld op Ahri, deckbuilding of nieuws..."
            autocomplete="off"
        >

    </div>


    <div id="search-results"
         class="article-grid">

    </div>


</main>


<footer>

    Riftblog · Nederlandse Riftbound blog en community

</footer>


<script>

const posts = [

{% for post in site.posts %}

    {
        title: {{ post.title | jsonify }},
        url: {{ post.url | relative_url | jsonify }},
        excerpt: {{ post.excerpt | strip_html | jsonify }},
        content: {{ post.content | strip_html | jsonify }},
        categories: {{ post.categories | join: " " | jsonify }},
        tags: {{ post.tags | join: " " | jsonify }}
    }{% unless forloop.last %},{% endunless %}

{% endfor %}

];


const input = document.getElementById("search-input");
const results = document.getElementById("search-results");


input.addEventListener("input", function () {

    const query = input.value
        .toLowerCase()
        .trim();


    if (query.length < 2) {

        results.innerHTML = "";

        return;

    }


    const matches = posts.filter(function (post) {

        const searchableText = [

            post.title,
            post.excerpt,
            post.content,
            post.categories,
            post.tags

        ].join(" ").toLowerCase();


        return searchableText.includes(query);

    });


    if (matches.length === 0) {

        results.innerHTML = `
            <p class="search-empty">
                Geen artikelen gevonden voor "${query}".
            </p>
        `;

        return;

    }


    results.innerHTML = matches.map(function (post) {

        return `

            <article class="article">

                <a href="${post.url}">

                    <div class="category">
                        ${post.categories}
                    </div>

                    <h3>
                        ${post.title}
                    </h3>

                    <p>
                        ${post.excerpt}
                    </p>

                </a>

            </article>

        `;

    }).join("");

});

</script>


</body>

</html>
