<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} — {{ site.title }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        header {
            background: #1f2937;
            border-bottom: 1px solid #374151;
            padding: 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 800px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .category {
            color: #a78bfa;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h1 {
            font-size: 48px;
            margin: 15px 0;
        }

        .date {
            color: #6b7280;
            margin-bottom: 50px;
        }

        article {
            font-size: 19px;
            line-height: 1.8;
            color: #d1d5db;
        }

        article h2 {
            color: white;
            margin-top: 45px;
        }

        article strong {
            color: white;
        }

        footer {
            border-top: 1px solid #374151;
            padding: 30px 20px;
            text-align: center;
            color: #6b7280;
        }

    </style>

</head>


<body>

<header>

    <div class="header-inner">

        <div class="logo">
            Riftblog
        </div>

        <nav>

            <a href="/riftbound-nl/">
                Home
            </a>

            <a href="/riftbound-nl/#nieuws">
                Nieuws
            </a>

            <a href="/riftbound-nl/#decks">
                Decks
            </a>

        </nav>

    </div>

</header>


<main>

    <div class="category">
        {{ page.categories }}
    </div>

    <h1>
        {{ page.title }}
    </h1>

    <div class="date">
        {{ page.date | date: "%d-%m-%Y" }}
    </div>

    <article>

        {{ content }}

    </article>

</main>


<footer>

    Riftblog · Nederlandse Riftbound blog en community

</footer>

</body>

</html>
