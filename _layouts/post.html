---

<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} — {{ site.title }}</title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>


<header>

    <div class="header-inner">

        <div class="logo">
            Rift<span>blog</span>
        </div>

        <nav>

            <a href="{{ '/' | relative_url }}">
                Home
            </a>

            <a href="{{ '/nieuws/' | relative_url }}">
                Nieuws
            </a>

            <a href="{{ '/decks/' | relative_url }}">
                Decks
            </a>

            <a href="{{ '/strategie/' | relative_url }}">
                Strategie
            </a>

        </nav>

    </div>

</header>


<main class="post-container">


    <div class="category">
        {{ page.categories }}
    </div>


    <h1 class="post-title">
        {{ page.title }}
    </h1>


    <div class="post-date">

        {{ page.date | date: "%d-%m-%Y" }}

    </div>


    <article class="post-content">

        {{ content }}

    </article>


</main>


<footer>

    Riftblog · Nederlandse Riftbound blog en community

</footer>


</body>

</html>
